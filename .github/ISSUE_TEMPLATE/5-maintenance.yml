name: 🧹 Maintenance / Technical Debt
description: Refactoring, dependencies, CI/CD, cleanup, or tooling work.
title: "[Maint]: "
labels: ["maintenance"]
body:
  - type: markdown
    attributes:
      value: |
        Primarily for maintainers and contributors. Examples: raise minSdk/targetSdk, replace a deprecated Android API, refactor a service, improve test coverage, speed up the Gradle build.

        ⚠️ Work inside the shared sign-in, key and API code belongs in [neutrino_shared_android](https://github.com/wcherry/neutrino_shared_android) — it is consumed here by local path, so a change there reaches every Neutrino Android app at once.

  - type: dropdown
    id: type
    attributes:
      label: Type of work
      multiple: true
      options:
        - Refactoring
        - Dependency update
        - Kotlin / Android SDK version bump
        - Gradle / project config
        - CI/CD
        - Testing
        - Performance
        - Accessibility
        - Code cleanup
        - Developer experience
        - Security hardening
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why is this needed?
      description: What's the cost of leaving it alone?
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      description: Rough plan, or the specific files and targets involved.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: Breaking changes, migration requirements, areas likely to regress. Note anything that would also need a change in NeutrinoShared or the backend.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
        - [ ]
