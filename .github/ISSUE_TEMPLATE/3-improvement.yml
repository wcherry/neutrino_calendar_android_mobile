name: 🔧 Improvement
description: Something already works, but it could be substantially better.
title: "[Improvement]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Feature vs. Improvement:** if Neutrino Calendar *can't* do X, file a Feature Request. If it *does* X but it's slow, awkward, or confusing, you're in the right place.

        Good examples: faster scrolling through the week view, better keyboard handling, clearer error messages, lower memory use, fewer taps to reach something.

  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: What does the app do today?
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed improvement
      description: What should it do instead?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: What's the concrete impact — time lost, confusion caused, workflow blocked?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of Neutrino Calendar is this about?
      multiple: true
      options:
        - Calendar views (month / week / day / agenda)
        - Creating and editing events
        - Recurring events
        - Reminders and alerts
        - Tasks
        - Attachments
        - Connected calendars (Google / Outlook / iCloud)
        - Offline and sync
        - Widgets / shortcuts / next-event notification
        - Encryption and keys
        - Sign-in / account
        - App lock
        - Settings
        - Other / Not sure
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Screenshots or examples
      description: Optional. Before/after sketches, examples from other apps, timing measurements.

  - type: input
    id: related
    attributes:
      label: Related issues
      placeholder: "#123, #456"
