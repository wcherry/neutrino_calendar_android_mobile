    url: https://github.com/wcherry/neutrino_calendar_android_mobile/security/advisories/new
    about: Please do NOT open a public issue. Report vulnerabilities privately through GitHub Security Advisories.
  - name: 🌐 Server, Web App, or API Issue
    url: https://github.com/wcherry/neutrino/issues/new/choose
    about: This repository is the Neutrino Calendar Android app only. Anything about the backend, the web UI, or Docker deployment belongs in the main Neutrino tracker.
  - name: 🤖 Shared Android Code (sign-in, encryption keys)
    url: https://github.com/wcherry/neutrino_shared_android/issues/new/choose
    about: Sign-in screens, the OAuth flow, and the encryption-key lifecycle are shared by every Neutrino Android app and live in neutrino_shared_android.
  - name: 📖 Documentation & Setup Guide
    url: https://github.com/wcherry/neutrino/blob/main/README.md
    about: Installation, configuration, and deployment instructions for the Neutrino server.
